name: Release to Nexus Mods & GitHub

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 2.0.0)'
        required: false
        default: '2.0.0'

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify Stingray Data Integrity
        run: |
          python scripts/verify.py

      - name: Determine Version
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            # Strip leading 'v' if present in tag name
            RAW_TAG="${{ github.event.release.tag_name }}"
            CLEAN_VERSION="${RAW_TAG#v}"
            echo "VERSION=${CLEAN_VERSION}" >> $GITHUB_OUTPUT
          fi

      - name: Extract Changelog for Release
        id: changelog
        run: |
          python -c "
          import os
          from pathlib import Path
          txt = Path('CHANGELOG.md').read_text(encoding='utf-8')
          parts = txt.split('## [')
          body = ''
          if len(parts) > 1:
              body = '## [' + parts[1].strip()
          else:
              body = txt.strip()
          delimiter = 'CHANGELOG_EOF'
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as f:
              f.write(f'body<<{delimiter}\n{body}\n{delimiter}\n')
          "

      - name: Build Distribution Packages
        run: |
          python scripts/build.py

      - name: Upload to Nexus Mods
        uses: Nexus-Mods/upload-action@v1.0.0-beta.11
        with:
          api_key: ${{ secrets.NEXUS_API_KEY }}
          mod_id: ${{ secrets.NEXUS_MOD_ID }}
          file_id: ${{ secrets.NEXUS_FILE_ID }}
          filename: dist/Helldivers2-Universal-Mod-Loader-v${{ steps.vars.outputs.VERSION }}.zip
          version: ${{ steps.vars.outputs.VERSION }}
          display_name: Helldivers 2 Universal Mod Loader v${{ steps.vars.outputs.VERSION }}
          description: "Helldivers 2 Universal Mod Loader v${{ steps.vars.outputs.VERSION }} - Indestructible pure-Lua universal runtime with Chef compatibility, F9 scaling menu, and 14-locale auto-detection."
          changelog: ${{ steps.changelog.outputs.body }}
          category: 'main'
          archive_existing_version: true
          primary_mod_manager_download: true
          allow_mod_manager_download: true
          update_mod_version: true

      - name: Attach Archive to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Helldivers2-Universal-Mod-Loader-v${{ steps.vars.outputs.VERSION }}.zip
          body: ${{ steps.changelog.outputs.body }}
